<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="340" style="background: linear-gradient(135deg, #090d16 0%, #0d1527 50%, #151b2e 100%); border-radius: 14px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
  <defs>
    <!-- Gradients -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.02" />
    </linearGradient>
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="1" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.1" />
    </linearGradient>

    <style>
      .bg-particle {
        animation: floatParticle 8s ease-in-out infinite alternate;
      }
      .bg-pulse {
        animation: pulseGlow 4s ease-in-out infinite alternate;
      }
      .stream-line {
        stroke-dasharray: 8 16;
        animation: dashStream 20s linear infinite;
      }
      .stream-fast {
        stroke-dasharray: 6 12;
        animation: dashStreamRev 14s linear infinite;
      }
      .node-pulse {
        animation: pulseNode 3s ease-in-out infinite alternate;
      }
      @keyframes dashStream {
        to { stroke-dashoffset: -400; }
      }
      @keyframes dashStreamRev {
        to { stroke-dashoffset: 400; }
      }
      @keyframes floatParticle {
        0% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
        50% { transform: translateY(-15px) translateX(10px); opacity: 0.8; }
        100% { transform: translateY(10px) translateX(-10px); opacity: 0.4; }
      }
      @keyframes pulseGlow {
        0% { opacity: 0.3; transform: scale(0.98); }
        100% { opacity: 0.7; transform: scale(1.02); }
      }
      @keyframes pulseNode {
        0% { r: 5px; opacity: 0.5; }
        100% { r: 8px; opacity: 1; }
      }
    </style>
  </defs>

  <!-- Background Grid Pattern -->
  <g opacity="0.06">
    <path d="M 0,40 L 1200,40 M 0,80 L 1200,80 M 0,120 L 1200,120 M 0,160 L 1200,160 M 0,200 L 1200,200 M 0,240 L 1200,240 M 0,280 L 1200,280 M 0,320 L 1200,320" stroke="#ffffff" stroke-width="1" />
    <path d="M 100,0 L 100,340 M 200,0 L 200,340 M 300,0 L 300,340 M 400,0 L 400,340 M 500,0 L 500,340 M 600,0 L 600,340 M 700,0 L 700,340 M 800,0 L 800,340 M 900,0 L 900,340 M 1000,0 L 1000,340 M 1100,0 L 1100,340" stroke="#ffffff" stroke-width="1" />
  </g>

  <!-- Ambient Background Glows -->
  <circle cx="150" cy="80" r="130" fill="url(#glowGrad)" class="bg-pulse" />
  <circle cx="1050" cy="260" r="160" fill="url(#glowGrad)" class="bg-pulse" />

  <!-- Animated Data Streams (Identity Synchronization & Directory Links) in Background -->
  <g fill="none">
    <path d="M-50,60 C 250,30 450,110 750,50 C 950,10 1100,70 1250,50" stroke="#38bdf8" stroke-width="2" opacity="0.25" class="stream-line" />
    <path d="M-50,290 C 200,320 450,250 700,290 C 950,330 1150,270 1250,295" stroke="#818cf8" stroke-width="2" opacity="0.25" class="stream-fast" />
    <path d="M50,170 C 300,220 500,120 700,220 C 950,300 1100,180 1200,190" stroke="#c084fc" stroke-width="1.5" opacity="0.2" class="stream-line" />
  </g>

  <!-- Subtle Floating Identity Nodes (Background Depth) -->
  <g fill="#38bdf8" class="bg-particle">
    <circle cx="120" cy="180" r="4" opacity="0.6" />
    <circle cx="280" cy="65" r="5" opacity="0.5" />
    <circle cx="980" cy="90" r="4" opacity="0.7" />
    <circle cx="1080" cy="190" r="6" opacity="0.4" />
    <circle cx="1120" cy="120" r="3" opacity="0.5" />
    <circle cx="160" cy="270" r="5" opacity="0.5" />
  </g>

  <!-- Animated Connector Nodes at Edges -->
  <circle cx="80" cy="60" fill="#38bdf8" class="node-pulse" />
  <circle cx="1120" cy="280" fill="#c084fc" class="node-pulse" />

  <!-- Foreground Content: Header Tag Pill -->
  <g transform="translate(600, 52)" text-anchor="middle">
    <rect x="-180" y="-15" width="360" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" opacity="0.9" />
    <text x="0" y="5" fill="#38bdf8" font-size="12" font-weight="700" letter-spacing="2">🔐 IDENTITY &amp; DIRECTORY ECOSYSTEM</text>
  </g>

  <!-- Main Title (Foreground, Sharp, High Contrast) -->
  <text x="600" y="125" text-anchor="middle" font-size="36" font-weight="800" fill="url(#textGrad)" letter-spacing="-0.5">
    Awesome User Provisioning &amp; Directory Services
  </text>

  <!-- Subtitle -->
  <text x="600" y="165" text-anchor="middle" font-size="15" font-weight="500" fill="#94a3b8" letter-spacing="0.2">
    Automated Joiner-Mover-Leaver Workflows • SCIM 2.0 Ingestion • Cloud &amp; Hybrid Directory Management
  </text>

  <!-- Tech Feature Pills (Foreground) -->
  <g transform="translate(600, 218)" text-anchor="middle" font-size="12" font-weight="600">
    <!-- Pill 1: SCIM 2.0 Protocol -->
    <g transform="translate(-360, 0)">
      <rect x="-75" y="-14" width="150" height="28" rx="8" fill="#131c31" stroke="#334155" stroke-width="1" />
      <text x="0" y="4" fill="#38bdf8">⚡ SCIM 2.0 Protocol</text>
    </g>
    <!-- Pill 2: JML Lifecycle -->
    <g transform="translate(-180, 0)">
      <rect x="-70" y="-14" width="140" height="28" rx="8" fill="#131c31" stroke="#334155" stroke-width="1" />
      <text x="0" y="4" fill="#60a5fa">🔄 JML Lifecycle</text>
    </g>
    <!-- Pill 3: LDAP & Active Directory -->
    <g transform="translate(0, 0)">
      <rect x="-85" y="-14" width="170" height="28" rx="8" fill="#131c31" stroke="#334155" stroke-width="1" />
      <text x="0" y="4" fill="#818cf8">📁 LDAP &amp; Active Directory</text>
    </g>
    <!-- Pill 4: RBAC & ABAC -->
    <g transform="translate(180, 0)">
      <rect x="-70" y="-14" width="140" height="28" rx="8" fill="#131c31" stroke="#334155" stroke-width="1" />
      <text x="0" y="4" fill="#a78bfa">🛡️ RBAC / ABAC</text>
    </g>
    <!-- Pill 5: Self-Hosted IAM -->
    <g transform="translate(355, 0)">
      <rect x="-75" y="-14" width="150" height="28" rx="8" fill="#131c31" stroke="#334155" stroke-width="1" />
      <text x="0" y="4" fill="#c084fc">🚀 Self-Hosted IAM</text>
    </g>
  </g>

  <!-- Metric Badges Row (Bottom Foreground) -->
  <g transform="translate(600, 275)" text-anchor="middle" font-size="12" font-weight="500" fill="#64748b">
    <text x="-240" y="0">🏢 Leading SaaS: Entra ID • Okta • JumpCloud • Rippling</text>
    <text x="0" y="0">|</text>
    <text x="240" y="0">💻 Top OSS: Keycloak • Authentik • Casdoor • ZITADEL</text>
  </g>

  <!-- Bottom Accent Beam -->
  <rect x="300" y="336" width="600" height="4" rx="2" fill="url(#beamGrad)" />
</svg>
